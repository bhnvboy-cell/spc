<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Admin — SPC Trainer</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  body.admin-body { padding-bottom: 40px; }
  .admin-header {
    background: linear-gradient(135deg, #0f766e, #115e59);
    color: #fff;
    padding: 16px;
  }
  .admin-header-inner {
    max-width: 900px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    flex-wrap: wrap;
  }
  .admin-header h1 { font-size: 1.15rem; }
  .admin-header a { color: #ccfbf1; text-decoration: none; font-weight: 600; font-size: .9rem; }
  .admin-main { max-width: 900px; margin: 0 auto; padding: 14px 12px; }
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat-card {
    background: var(--card); border-radius: var(--radius); padding: 14px;
    box-shadow: var(--shadow); text-align: center;
  }
  .stat-card .n { font-size: 1.6rem; font-weight: 700; color: var(--primary-dark); }
  .stat-card .l { font-size: .75rem; color: var(--muted); font-weight: 600; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  .toolbar .input { flex: 1; min-width: 160px; }
  table.users { width: 100%; border-collapse: collapse; background: var(--card); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  table.users th, table.users td { padding: 10px 10px; text-align: left; font-size: .85rem; border-bottom: 1px solid var(--border); }
  table.users th { background: #f8fafc; color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .4px; }
  table.users tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .72rem; font-weight: 700; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.off { background: var(--danger-bg); color: var(--danger); }
  .badge.admin { background: #ede9fe; color: #6d28d9; }
  .badge.user { background: var(--primary-light); color: var(--primary-dark); }
  .badge.online { background: var(--ok-bg); color: var(--ok); }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .row-actions .btn { flex: none; padding: 6px 10px; font-size: .75rem; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #0f172a; color: #fff; padding: 12px 18px; border-radius: 12px;
    font-size: .9rem; font-weight: 600; z-index: 100; opacity: 0;
    transition: opacity .25s; pointer-events: none; max-width: 90vw;
  }
  .toast.show { opacity: 1; }
  .toast.err { background: var(--danger); }
  .modal-back {
    display: none; position: fixed; inset: 0; background: rgba(15,23,42,.5);
    z-index: 90; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-back.show { display: flex; }
  .modal {
    background: #fff; border-radius: 16px; padding: 20px; width: 100%; max-width: 360px;
    box-shadow: 0 20px 50px rgba(0,0,0,.3);
  }
  .modal h3 { margin-bottom: 4px; color: var(--primary-dark); }
  .modal p { font-size: .85rem; color: var(--muted); margin-bottom: 10px; }
  .modal .btn-row .btn { flex: 1; }
  .self-pw { margin-top: 18px; }
  #lbTable td { vertical-align: middle; }
  .rank-medal { font-weight: 800; }
  .pct-bar-wrap { background: var(--border); border-radius: 6px; height: 8px; width: 70px; display: inline-block; vertical-align: middle; margin-right: 6px; overflow: hidden; }
  .pct-bar { height: 100%; background: var(--primary); border-radius: 6px; }
  .pct-bar.gold { background: #d97706; }
  .pct-bar.silver { background: #94a3b8; }
  .pct-bar.bronze { background: #b45309; }
  .best-score { font-weight: 700; }
  @media (max-width: 600px) {
    table.users .hide-sm { display: none; }
  }
</style>
</head>
<body class="admin-body">
  <header class="admin-header">
    <div class="admin-header-inner">
      <h1 data-i18n="adm.panel">⚙️ Admin Panel</h1>
      <div style="display:flex;gap:14px;align-items:center;">
        <span id="whoami" style="font-size:.85rem;opacity:.9;"></span>
        <select id="langSel" class="input" style="max-width:150px;padding:6px 8px;" aria-label="Language"></select>
        <a href="/" data-i18n="adm.app">← App</a>
        <a href="#" id="btnLogout" data-i18n="u.logout">Logout</a>
      </div>
    </div>
  </header>

  <main class="admin-main">
    <div class="stats-row">
      <div class="stat-card"><div class="n" id="stTotal">–</div><div class="l" data-i18n="adm.accounts">Accounts</div></div>
      <div class="stat-card"><div class="n" id="stEnabled">–</div><div class="l" data-i18n="adm.enabled">Enabled</div></div>
      <div class="stat-card"><div class="n" id="stOnline">–</div><div class="l" data-i18n="adm.activeSessions">Active sessions</div></div>
      <div class="stat-card"><div class="n" id="stDisabled">–</div><div class="l" data-i18n="adm.disabled">Disabled</div></div>
    </div>

    <div class="card" id="leaderCard">
      <h3 data-i18n="adm.lbTitle">🏆 Quiz leaderboard — who scored high</h3>
      <p data-i18n="adm.lbNote" style="font-size:.8rem;color:var(--muted);margin-bottom:10px;">Best attempt per user · updates every 15s</p>
      <table class="users" id="lbTable">
        <thead>
          <tr><th>#</th><th data-i18n="adm.user">User</th><th data-i18n="adm.bestScore">Best score</th><th>%</th><th data-i18n="adm.attempts" class="hide-sm">Attempts</th><th data-i18n="adm.when" class="hide-sm">When</th></tr>
        </thead>
        <tbody id="lbBody"><tr><td colspan="6" data-i18n="adm.loading" style="color:var(--muted)">Loading…</td></tr></tbody>
      </table>
      <div id="lbPending" style="margin-top:10px;font-size:.82rem;color:var(--muted);"></div>
    </div>

    <div class="card self-pw">
      <h3 data-i18n="adm.myPwTitle">Change my admin password</h3>
      <div class="field-row" style="grid-template-columns:1fr 1fr 1fr;">
        <div>
          <label class="field-label" data-i18n="u.pwCur">Current</label>
          <input type="password" class="input" id="myCurrent" autocomplete="current-password">
        </div>
        <div>
          <label class="field-label" data-i18n="u.pwNew">New</label>
          <input type="password" class="input" id="myNew" autocomplete="new-password">
        </div>
        <div>
          <label class="field-label" data-i18n="u.pwNew2">Confirm</label>
          <input type="password" class="input" id="myNew2" autocomplete="new-password">
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="btnMyPw" data-i18n="adm.updatePw">Update password</button>
      </div>
    </div>

    <div class="toolbar">
      <input class="input" id="search" type="search" placeholder="Search username…" data-i18n-ph="adm.search">
    </div>

    <table class="users" id="usersTable">
      <thead>
        <tr>
          <th data-i18n="adm.user">User</th>
          <th data-i18n="adm.role">Role</th>
          <th data-i18n="adm.status">Status</th>
          <th data-i18n="adm.sessions" class="hide-sm">Sessions</th>
          <th data-i18n="adm.lastLogin" class="hide-sm">Last login</th>
          <th data-i18n="adm.actions">Actions</th>
        </tr>
      </thead>
      <tbody id="usersBody"></tbody>
    </table>
  </main>

  <!-- Password reset modal -->
  <div class="modal-back" id="pwModal">
    <div class="modal">
      <h3 data-i18n="adm.resetPw">Reset password</h3>
      <p><span data-i18n="adm.userColon">User:</span> <strong id="pwUser"></strong></p>
      <label class="field-label" data-i18n="u.pwNew">New password (min 6 chars)</label>
      <input type="text" class="input" id="pwNew" autocomplete="off">
      <div class="btn-row">
        <button class="btn btn-outline" id="pwCancel" data-i18n="btn.cancel">Cancel</button>
        <button class="btn btn-primary" id="pwSave" data-i18n="btn.save">Save</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script src="js/i18n.js"></script>
<script>
(function () {
  window.SPC_LANG = (function () {
    var s = null;
    try { s = localStorage.getItem('spcLang'); } catch (e) {}
    return (s && LANGS[s]) ? s : 'en';
  })();
  document.documentElement.lang = window.SPC_LANG;
  document.documentElement.dir = LANG_DIR[window.SPC_LANG] || 'ltr';
  document.title = t('adm.title');
  document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(function (el) { el.placeholder = t(el.dataset.i18nPh); });

  var sel = document.getElementById('langSel');
  Object.keys(LANGS).forEach(function (code) {
    var o = document.createElement('option');
    o.value = code; o.textContent = LANGS[code];
    if (code === window.SPC_LANG) o.selected = true;
    sel.appendChild(o);
  });
  sel.setAttribute('aria-label', t('ui.lang'));
  sel.addEventListener('change', function () {
    try { localStorage.setItem('spcLang', sel.value); } catch (e) {}
    location.reload();
  });
})();
</script>
<script>
(function () {
  var toastEl = document.getElementById('toast');
  var usersBody = document.getElementById('usersBody');
  var searchEl = document.getElementById('search');
  var allUsers = [];
  var pwTarget = null;

  function toast(msg, isErr) {
    toastEl.textContent = msg;
    toastEl.className = 'toast show' + (isErr ? ' err' : '');
    setTimeout(function () { toastEl.className = 'toast'; }, 2600);
  }

  function api(path, opts) {
    opts = opts || {};
    opts.credentials = 'same-origin';
    opts.headers = Object.assign({ 'X-Requested-With': 'XMLHttpRequest' }, opts.headers || {});
    return fetch(path, opts).then(function (r) {
      if (r.status === 401) { location.href = '/login'; throw new Error('auth'); }
      return r.json().then(function (d) {
        if (!r.ok) throw new Error(d.error || t('adm.error'));
        return d;
      });
    });
  }

  function fmtDate(s) {
    if (!s) return '—';
    try {
      var d = new Date(s);
      return d.toLocaleString();
    } catch (e) { return s; }
  }

  function render() {
    var q = (searchEl.value || '').toLowerCase().trim();
    var list = allUsers.filter(function (u) {
      return !q || u.username.indexOf(q) !== -1;
    });
    usersBody.innerHTML = list.map(function (u) {
      var status = u.enabled
        ? '<span class="badge ok">' + t('adm.enabled') + '</span>'
        : '<span class="badge off">' + t('adm.disabled') + '</span>';
      var role = u.role === 'admin'
        ? '<span class="badge admin">' + t('adm.roleAdmin') + '</span>'
        : '<span class="badge user">' + t('adm.roleUser') + '</span>';
      var sess = u.sessions > 0
        ? '<span class="badge online">' + t('adm.online', { n: u.sessions }) + '</span>'
        : '<span style="color:var(--muted)">0</span>';
      var toggleLabel = u.enabled ? t('adm.disable') : t('adm.enable');
      return '<tr data-u="' + u.username + '">' +
        '<td><strong>' + u.username + '</strong></td>' +
        '<td>' + role + '</td>' +
        '<td>' + status + '</td>' +
        '<td class="hide-sm">' + sess + '</td>' +
        '<td class="hide-sm">' + fmtDate(u.last_login) + '</td>' +
        '<td><div class="row-actions">' +
          '<button class="btn btn-outline act-pw">' + t('adm.pwBtn') + '</button>' +
          (u.role === 'admin' ? '' : '<button class="btn btn-outline act-toggle">' + toggleLabel + '</button>') +
          '<button class="btn btn-outline act-sess">' + t('adm.kick') + '</button>' +
        '</div></td></tr>';
    }).join('');
  }

  function refresh() {
    return api('/api/admin/users').then(function (d) {
      allUsers = d.users || [];
      var total = allUsers.length;
      var enabled = allUsers.filter(function (u) { return u.enabled; }).length;
      var online = allUsers.reduce(function (a, u) { return a + (u.sessions || 0); }, 0);
      document.getElementById('stTotal').textContent = total;
      document.getElementById('stEnabled').textContent = enabled;
      document.getElementById('stOnline').textContent = online;
      document.getElementById('stDisabled').textContent = total - enabled;
      render();
    }).catch(function (e) {
      if (e.message !== 'auth') toast(e.message, true);
    }).then(loadLeaderboard);
  }

  function loadLeaderboard() {
    return api('/api/quiz/leaderboard').then(function (d) {
      var lb = d.leaderboard || [];
      var pending = d.not_attempted || [];
      var body = document.getElementById('lbBody');
      if (!lb.length) {
        body.innerHTML = '<tr><td colspan="6" style="color:var(--muted)">' + t('adm.noAttempts') + '</td></tr>';
      } else {
        var medals = ['🥇', '🥈', '🥉'];
        body.innerHTML = lb.map(function (r, i) {
          var medal = i < 3 ? medals[i] : (i + 1);
          var cls = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
          var when = fmtDate(r.created_at);
          return '<tr>' +
            '<td><span class="rank-medal">' + medal + '</span></td>' +
            '<td><strong>' + r.username + '</strong></td>' +
            '<td class="best-score">' + r.score + ' / ' + r.total +
              ' <span class="pct-bar-wrap"><span class="pct-bar ' + cls + '" style="width:' + r.pct + '%"></span></span></td>' +
            '<td><strong>' + r.pct + '%</strong></td>' +
            '<td class="hide-sm">' + r.attempts + '</td>' +
            '<td class="hide-sm">' + when + '</td>' +
            '</tr>';
        }).join('');
      }
      document.getElementById('lbPending').textContent =
        pending.length ? t('adm.notAttempted') + ' ' + pending.join(', ') : '';
    }).catch(function () { /* non-fatal */ });
  }

  // row actions
  usersBody.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    var row = btn.closest('tr');
    var username = row && row.getAttribute('data-u');
    if (!username) return;

    if (btn.classList.contains('act-pw')) {
      pwTarget = username;
      document.getElementById('pwUser').textContent = username;
      document.getElementById('pwNew').value = '';
      document.getElementById('pwModal').classList.add('show');
      document.getElementById('pwNew').focus();
      return;
    }
    if (btn.classList.contains('act-toggle')) {
      api('/api/admin/users/' + encodeURIComponent(username) + '/toggle', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: '{}'
      }).then(function () { toast(t('adm.updated', { u: username })); refresh(); })
        .catch(function (e) { toast(e.message, true); });
      return;
    }
    if (btn.classList.contains('act-sess')) {
      api('/api/admin/users/' + encodeURIComponent(username) + '/sessions', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: '{}'
      }).then(function () { toast(t('adm.revoked', { u: username })); refresh(); })
        .catch(function (e) { toast(e.message, true); });
    }
  });

  // modal
  document.getElementById('pwCancel').addEventListener('click', function () {
    document.getElementById('pwModal').classList.remove('show');
    pwTarget = null;
  });
  document.getElementById('pwSave').addEventListener('click', function () {
    if (!pwTarget) return;
    var np = document.getElementById('pwNew').value;
    if (!np || np.length < 6) { toast(t('auth.min6'), true); return; }
    api('/api/admin/users/' + encodeURIComponent(pwTarget) + '/password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: np })
    }).then(function () {
      toast(t('adm.pwReset', { u: pwTarget }));
      document.getElementById('pwModal').classList.remove('show');
      pwTarget = null;
      refresh();
    }).catch(function (e) { toast(e.message, true); });
  });

  // self password
  document.getElementById('btnMyPw').addEventListener('click', function () {
    var c = document.getElementById('myCurrent').value;
    var n = document.getElementById('myNew').value;
    var n2 = document.getElementById('myNew2').value;
    if (n !== n2) { toast(t('auth.mismatch'), true); return; }
    if (!n || n.length < 6) { toast(t('auth.min6'), true); return; }
    api('/api/change-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ current: c, new: n })
    }).then(function () {
      toast(t('auth.updated'));
      document.getElementById('myCurrent').value = '';
      document.getElementById('myNew').value = '';
      document.getElementById('myNew2').value = '';
    }).catch(function (e) { toast(e.message, true); });
  });

  // logout
  document.getElementById('btnLogout').addEventListener('click', function (e) {
    e.preventDefault();
    api('/api/logout', { method: 'POST', body: '{}' })
      .then(function () { location.href = '/login'; })
      .catch(function () { location.href = '/login'; });
  });

  searchEl.addEventListener('input', render);

  // whoami + boot
  api('/api/me').then(function (me) {
    if (me.role !== 'admin') { location.href = '/'; return; }
    document.getElementById('whoami').textContent = me.username;
    refresh();
    setInterval(refresh, 15000);
  }).catch(function () {});
})();
</script>
</body>
</html>
